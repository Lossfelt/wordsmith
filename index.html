<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Tegn-variant test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    margin: 0;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 400;
    margin-bottom: 1rem;
  }
  .controls {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  button {
    background: #222;
    color: #eee;
    border: 1px solid #444;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 4px;
  }
  button.active {
    background: #2a6;
    border-color: #2a6;
    color: #000;
  }
  button:hover:not(.active) {
    background: #333;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    background: #000;
    padding: 1rem;
    border: 1px solid #333;
    border-radius: 8px;
  }
  .cell {
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    background: #1a1a1a;
    color: #6f6;
    border-radius: 3px;
    user-select: none;
    position: relative;
    will-change: transform, filter;
  }
  .status {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #888;
  }
</style>
</head>
<body>
  <h1>10 x 10 tegn-grid</h1>
  <div class="controls">
    <button id="btnA">Variant A: bytt alle</button>
    <button id="btnB">Variant B: bytt ett</button>
    <button id="btnC">Variant C: TTL per celle</button>
    <button id="btnStop">Stopp</button>
  </div>
  <div id="grid"></div>
  <div class="status" id="status">Variant: ingen</div>

<script>
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const SIZE = 10;
  const TOTAL = SIZE * SIZE;
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const btnA = document.getElementById('btnA');
  const btnB = document.getElementById('btnB');
  const btnStop = document.getElementById('btnStop');

  const cells = [];
  function randChar() {
    return CHARS[Math.floor(Math.random() * CHARS.length)];
  }

  // Forstørrelsesglassparametere
  const MAX_SCALE  = 0.5;   // maks ekstra skalering i senter (1 + 0.5 = 1.5x)
  const SIGMA      = 52;    // gaussisk spredning i piksler (~1.2 cellebredder)
  const MAX_BRIGHT = 0.6;   // maks ekstra lysstyrke i senter

  let cellCenters = null;

  function buildCellCenters() {
    const gridRect = grid.getBoundingClientRect();
    cellCenters = cells.map(c => {
      const r = c.getBoundingClientRect();
      return {
        x: r.left - gridRect.left + r.width  / 2,
        y: r.top  - gridRect.top  + r.height / 2
      };
    });
  }

  function updateLens(mouseX, mouseY) {
    if (!cellCenters) buildCellCenters();
    for (let i = 0; i < TOTAL; i++) {
      const dx   = mouseX - cellCenters[i].x;
      const dy   = mouseY - cellCenters[i].y;
      const g    = Math.exp(-(dx * dx + dy * dy) / (2 * SIGMA * SIGMA));
      const s    = 1 + MAX_SCALE  * g;
      const b    = 1 + MAX_BRIGHT * g;
      cells[i].style.transform  = `scale(${s.toFixed(4)})`;
      cells[i].style.filter     = `brightness(${b.toFixed(4)})`;
      cells[i].style.zIndex     = Math.round(g * 30);
    }
  }

  function resetLens() {
    for (const c of cells) {
      c.style.transform = '';
      c.style.filter    = '';
      c.style.zIndex    = '';
    }
  }

  grid.addEventListener('mousemove', e => {
    const rect = grid.getBoundingClientRect();
    updateLens(e.clientX - rect.left, e.clientY - rect.top);
  });
  grid.addEventListener('mouseleave', resetLens);

  // Ugyldiggjør cache ved resize
  window.addEventListener('resize', () => { cellCenters = null; });

  for (let i = 0; i < TOTAL; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = randChar();
    grid.appendChild(c);
    cells.push(c);
  }

  let timer = null;
  let cellTimers = [];
  let mode = null;

  const btnC = document.getElementById('btnC');

  function randTTL() {
    return 1000 + Math.random() * 4000; // 1–5 sekunder
  }

  function stopCellTimers() {
    for (const t of cellTimers) clearTimeout(t);
    cellTimers = [];
  }

  function scheduleCellC(idx) {
    const t = setTimeout(() => {
      if (mode !== 'C') return;
      cells[idx].textContent = randChar();
      scheduleCellC(idx);
    }, randTTL());
    cellTimers[idx] = t;
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    stopCellTimers();
  }

  function setMode(newMode) {
    stop();
    mode = newMode;
    btnA.classList.toggle('active', mode === 'A');
    btnB.classList.toggle('active', mode === 'B');
    btnC.classList.toggle('active', mode === 'C');
    if (mode === 'A') {
      statusEl.textContent = 'Variant A: bytter alle hvert sekund';
      timer = setInterval(() => {
        for (const c of cells) c.textContent = randChar();
      }, 1000);
    } else if (mode === 'B') {
      statusEl.textContent = 'Variant B: bytter ett tilfeldig hvert sekund';
      timer = setInterval(() => {
        const idx = Math.floor(Math.random() * TOTAL);
        cells[idx].textContent = randChar();
      }, 1000);
    } else if (mode === 'C') {
      statusEl.textContent = 'Variant C: kvar celle har tilfeldig TTL (1–5 s)';
      for (let i = 0; i < TOTAL; i++) scheduleCellC(i);
    } else {
      statusEl.textContent = 'Variant: ingen';
    }
  }

  btnA.addEventListener('click', () => setMode('A'));
  btnB.addEventListener('click', () => setMode('B'));
  btnC.addEventListener('click', () => setMode('C'));
  btnStop.addEventListener('click', () => setMode(null));
</script>
</body>
</html>
