<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Tegn-variant test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <br><br><br>
  <h1>10 x 10 tegn-grid</h1>

  <div class="controls">

    <div class="btn-wrap">
      <button id="btnA">Variant A: bytt alle</button>
      <div class="popover">
        <div class="popover-title">Variant A</div>
        <div class="param-row">
          <span>Intervall</span>
          <span class="val" id="aIntervalVal">1000</span>&thinsp;ms
        </div>
        <input type="range" id="aInterval" min="100" max="5000" step="100" value="1000">
      </div>
    </div>

    <div class="btn-wrap">
      <button id="btnB">Variant B: bytt ett</button>
      <div class="popover">
        <div class="popover-title">Variant B</div>
        <div class="param-row">
          <span>Intervall</span>
          <span class="val" id="bIntervalVal">1000</span>&thinsp;ms
        </div>
        <input type="range" id="bInterval" min="100" max="5000" step="100" value="1000">
      </div>
    </div>

    <div class="btn-wrap">
      <button id="btnC">Variant C: TTL per celle</button>
      <div class="popover">
        <div class="popover-title">Variant C</div>
        <div class="param-row">
          <span>Min TTL</span>
          <span class="val" id="cMinVal">1000</span>&thinsp;ms
        </div>
        <input type="range" id="cMin" min="100" max="9900" step="100" value="1000">
        <div class="param-row">
          <span>Maks TTL</span>
          <span class="val" id="cMaxVal">5000</span>&thinsp;ms
        </div>
        <input type="range" id="cMax" min="200" max="10000" step="100" value="5000">
      </div>
    </div>

    <button id="btnStop">Stopp</button>
    <button id="btnFog" class="btn-fog">Fog of war</button>
  </div>

  <div id="grid"></div>
  <div class="status" id="status">Variant: ingen</div>

  <div class="inventory">
    <div class="inventory-label">Inventory</div>
    <div class="inventory-slots" id="inventory"></div>
  </div>

  <!-- Lastes i rekkefølge: grid definerer cells[], lens og modes bruker den -->
  <script src="grid.js"></script>
  <script src="lens.js"></script>
  <script src="modes.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
