<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tegn-variant test</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="Wordsmith-favicon.png">
</head>
<body>

  <!-- Letefase-scenen: grid, kontroller og inventory -->
  <div id="scene-search" class="scene">
    <br><br><br>
    <h1>10 x 10 tegn-grid</h1>

    <div class="controls">

      <div class="btn-wrap">
        <button id="btnA">Variant A: bytt alle</button>
        <div class="popover">
          <div class="popover-title">Variant A</div>
          <div class="param-row">
            <span>Intervall</span>
            <span class="val" id="aIntervalVal">1000</span>&thinsp;ms
          </div>
          <input type="range" id="aInterval" min="100" max="5000" step="100" value="1000">
        </div>
      </div>

      <div class="btn-wrap">
        <button id="btnB">Variant B: bytt ett</button>
        <div class="popover">
          <div class="popover-title">Variant B</div>
          <div class="param-row">
            <span>Intervall</span>
            <span class="val" id="bIntervalVal">1000</span>&thinsp;ms
          </div>
          <input type="range" id="bInterval" min="100" max="5000" step="100" value="1000">
        </div>
      </div>

      <div class="btn-wrap">
        <button id="btnC">Variant C: TTL per celle</button>
        <div class="popover">
          <div class="popover-title">Variant C</div>
          <div class="param-row">
            <span>Min TTL</span>
            <span class="val" id="cMinVal">1000</span>&thinsp;ms
          </div>
          <input type="range" id="cMin" min="100" max="9900" step="100" value="1000">
          <div class="param-row">
            <span>Maks TTL</span>
            <span class="val" id="cMaxVal">5000</span>&thinsp;ms
          </div>
          <input type="range" id="cMax" min="200" max="10000" step="100" value="5000">
        </div>
      </div>

      <button id="btnStop">Stopp</button>
      <button id="btnFog" class="btn-fog">Fog of war</button>
      <button id="btnSearch" class="btn-search">Start letefasen</button>
      <button id="btnTestCombat">Test kamp</button>
    </div>

    <div class="search-timer" id="timer" style="display:none"></div>

    <div id="grid"></div>
    <div class="status" id="status">Variant: ingen</div>

    <div class="inventory">
      <div class="inventory-label">Inventory</div>
      <div class="inventory-slots" id="inventory"></div>
    </div>
  </div>

  <!-- Kamp-scenen: bygg et ord av bokstavene dine mot fiendeordet -->
  <div id="scene-combat" class="scene" hidden>
    <h1>Kamp</h1>

    <div class="combat-health">
      <span class="combat-health-label">Helse</span>
      <div class="combat-health-bar"><div class="combat-health-fill" id="healthFill"></div></div>
      <span class="combat-health-num" id="healthNum">100 / 100</span>
    </div>

    <div class="combat-enemy">
      <div class="combat-enemy-label">Fiende</div>
      <div class="combat-enemy-word" id="enemyWord"></div>
      <div class="combat-enemy-strength">Styrke: <span id="enemyStrength"></span></div>
    </div>

    <div class="combat-build">
      <div class="combat-word-label">Ditt ord (verdi: <span id="wordValue">0</span>)</div>
      <div class="combat-word" id="combatWord"></div>
      <div class="combat-pool-label">Dine bokstaver</div>
      <div class="combat-sort" id="combatSort">
        <button type="button" class="combat-sort-btn active" data-sort="alpha">Alfabetisk</button>
        <button type="button" class="combat-sort-btn" data-sort="value">Verdi</button>
        <button type="button" class="combat-sort-btn" data-sort="split">Konsonant / vokal</button>
      </div>
      <div class="combat-pool" id="combatPool"></div>
    </div>

    <div class="combat-actions">
      <button id="btnAttack" disabled>Angrip</button>
      <button id="btnFlee">Flykt</button>
    </div>

    <div class="combat-result" id="combatResult" hidden>
      <div class="combat-result-text" id="combatResultText"></div>
      <div class="combat-result-changes" id="combatResultChanges"></div>
      <button id="btnCombatBack">Tilbake</button>
    </div>
  </div>

  <!-- Lastes i rekkefølge: grid → lens → modes → inventory → scenes → combat → letefase -->
  <script src="grid.js"></script>
  <script src="lens.js"></script>
  <script src="modes.js"></script>
  <script src="inventory.js"></script>
  <script src="scenes.js"></script>
  <script src="combat.js"></script>
  <script src="letefase.js"></script>
</body>
</html>
